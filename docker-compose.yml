services:
  db:
    image: postgres:15-alpine
    container_name: finance-auditor-db
    restart: always
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: finance_auditor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: finance-auditor-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://auditor:securepassword123@db:5432/finance_auditor?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=supersecretnextauthkey12345
      # - GOOGLE_CLIENT_ID=
      # - GOOGLE_CLIENT_SECRET=
      # - ALLOWED_EMAIL=
    depends_on:
      - db

volumes:
  db_data:
